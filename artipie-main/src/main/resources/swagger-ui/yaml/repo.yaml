openapi: "3.0.0"
info:
  version: 1.0.0
  title: Artipie - OpenAPI 3.0
  description:
    This is Atripie Server based on the OpenAPI 3.0 specification.
  license:
    name: MIT
externalDocs:
  description: Find out more about Artipie
  url: https://github.com/artipie
tags:
  - name: repository
    description: Operations about repository
paths:
  /api/v1/repository/list:
    get:
      summary: List all repositories.
      operationId: listAll
      tags:
        - repository
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of the existing repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}:
    get:
      summary: Get repository settings
      operationId: getRepo
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Full repository settings
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AliasRepository'
                  - $ref: '#/components/schemas/FullRepository'
        '400':
          description: Wrong repository name
        '404':
          description: Repository not found
        '409':
          description: Repository has settings duplicates
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    head:
      summary: Checks if repository settings exist
      operationId: existRepo
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Repository exists
        '400':
          description: Wrong repository name
        '404':
          description: Repository not found
        '409':
          description: Repository has settings duplicates
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Create or update repository
      operationId: createOrUpdateRepo
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      requestBody:
        description: Create or update repository
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Repository'
        required: true
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Creates or update repository with name {rname}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullRepository'
        '400':
          description: Wrong repository name
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove repository
      operationId: removeRepo
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Remove a repository with name {rname}
        '400':
          description: Wrong repository name
        '404':
          description: Repository not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/content:
    get:
      summary: List repository content (browse artifacts)
      description: |
        Returns one level only (direct children of path); no deep recursion.
        Use path, limit, and offset for pagination. May be slow on very large repos.
        Supported for file, file-proxy, huggingface-proxy (cached paths); other types may be unsupported.
      operationId: listContent
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Path within repository (default root)
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          description: Number of entries to skip (pagination)
          schema:
            type: integer
            default: 0
        - name: includeSize
          in: query
          required: false
          description: If true, include size (bytes) for file entries
          schema:
            type: boolean
            default: false
        - name: includeDownloadUrl
          in: query
          required: false
          description: If true, include downloadUrl for file entries (repo port 8080)
          schema:
            type: boolean
            default: false
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of content entries (files and directories)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentEntry'
        '400':
          description: Wrong repository name or path
        '403':
          description: Permission denied
        '404':
          description: Repository not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Upload repository content (artifact)
      description: |
        Upload a file at the given path. Body is raw binary. Overwrites if path exists.
        Path is required. Enforce size limit (Content-Length); 413 if exceeded.
        Requires CREATE or UPDATE permission.
      operationId: uploadContent
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Path within repository (artifact path)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Content uploaded
        '201':
          description: Content created
        '400':
          description: Invalid or missing path
        '403':
          description: Permission denied
        '404':
          description: Repository not found
        '413':
          description: Payload too large
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete repository content (artifact or directory)
      description: |
        Deletes a single artifact (path to file) or a directory and all children if recursive=true.
        Path is required. For directories, set recursive=true (query) or X-Recursive-Delete true (header).
        Requires DELETE or WRITE permission. Audit log recommended.
      operationId: deleteContent
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Path within repository (artifact or directory to delete)
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          description: If true, delete directory and all children
          schema:
            type: boolean
            default: false
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Content deleted
        '400':
          description: Invalid path or missing path
        '403':
          description: Permission denied
        '404':
          description: Repository not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/content/metadata:
    get:
      summary: Get single artifact metadata
      description: Returns metadata (path, type, size, lastModified) for one path.
      operationId: getContentMetadata
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          description: Artifact path
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '400':
          description: Invalid path
        '403':
          description: Permission denied
        '404':
          description: Repository or path not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/content/search:
    get:
      summary: Search repository content
      description: |
        Search for artifacts by name/path prefix under the given path.
        q is prefix-matched against relative path; max length 256. Use path to scope search.
      operationId: searchContent
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: q
          in: query
          required: true
          description: Search query (prefix match on path/name)
          schema:
            type: string
            maxLength: 256
        - name: path
          in: query
          required: false
          description: Scope search under this path (default root)
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Matching content entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentEntry'
        '400':
          description: Invalid query or path
        '403':
          description: Permission denied
        '404':
          description: Repository not found
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/move:
    put:
      summary: Move repository
      operationId: moveRepo
      tags:
        - repository
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      requestBody:
        description: Move a repository
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveToRepository'
        required: true
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Remove a repository with name {rname}
        '400':
          description: Wrong repository name
        '404':
          description: Repository not found
        '409':
          description: Repository has settings duplicates
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/storages:
    get:
      summary: Get repository storage aliases
      operationId: getRepoAliases
      tags:
        - storage aliases
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Full storage alias settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageAlias'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repository/{rname}/storages/{aname}:
    put:
      summary: Add or update repository storage alias
      operationId: addRepoAlias
      tags:
        - storage aliases
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: aname
          in: path
          required: true
          description: Name of the storage alias
          schema:
            type: string
      requestBody:
        description: Create a new storage alias
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage'
        required: true
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Alias added successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete repository storage alias
      operationId: deleteRepoAlias
      tags:
        - storage aliases
      parameters:
        - name: rname
          in: path
          required: true
          description: Name of the repository
          schema:
            type: string
        - name: aname
          in: path
          required: true
          description: Name of the storage alias
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Alias was removed successfully
        '404':
          description: Alias does not exist
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/storages:
    get:
      summary: Get common Artipie storage aliases
      operationId: getAliases
      tags:
        - storage aliases
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Full aliases settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageAlias'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/storages/{aname}:
    put:
      summary: Add or update common Artipie storage alias
      operationId: addAlias
      tags:
        - storage aliases
      parameters:
        - name: aname
          in: path
          required: true
          description: Name of the storage alias
          schema:
            type: string
      requestBody:
        description: Create a new storage alias
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage'
        required: true
      security:
        - bearerAuth: [ ]
      responses:
        '201':
          description: Alias added successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete common Artipie storage alias
      operationId: deleteAlias
      tags:
        - storage aliases
      parameters:
        - name: aname
          in: path
          required: true
          description: Name of the storage alias
          schema:
            type: string
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Alias was removed successfully
        '404':
          description: Alias does not exist
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Repository:
      type: object
      required:
        - repo
      properties:
        repo:
          type: object
    FullRepository:
      type: object
      required:
        - type
        - storage
      properties:
        type:
          type: string
        storage:
          type: object
    AliasRepository:
      type: object
      required:
        - type
        - storage
      properties:
        type:
          type: string
        storage:
          type: string
    StorageAlias:
      type: object
      required:
        - alias
        - storage
      properties:
        alias:
          type: string
        storage:
          type: object
    Storage:
      type: object
      required:
        - type
      properties:
        type:
          type: string
    MoveToRepository:
      type: object
      required:
        - new_name
      properties:
        new_name:
          type: string
    ContentEntry:
      type: object
      required:
        - name
        - path
        - type
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, dir]
        size:
          type: integer
          description: Size in bytes (optional, for files)
  responses:
    UnauthorizedError:
      description: "Access token is missing or invalid"
security:
  - bearerAuth: []
